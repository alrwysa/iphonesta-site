name: iphonesta

services:
  site:
    image: nginx:1.27-alpine
    container_name: iphonesta-site
    restart: unless-stopped
    command: sh -c "mkdir -p /usr/share/nginx/html/img && wget -qO /usr/share/nginx/html/index.html https://raw.githubusercontent.com/alrwysa/iphonesta-site/main/site/index.html && wget -qO /usr/share/nginx/html/img/logo.png https://raw.githubusercontent.com/alrwysa/iphonesta-site/main/site/img/logo.png && exec nginx -g 'daemon off;'"
    expose:
      - "80"
    networks:
      public-proxy:
        aliases:
          - iphonesta-site

  route-sync:
    image: curlimages/curl:8.10.1
    container_name: iphonesta-route-sync
    restart: unless-stopped
    network_mode: container:reverse-proxy
    entrypoint: sh
    command:
      - -c
      - |
        echo "route-sync starting";
        while true; do
          routes=$$(curl -s http://localhost:2019/config/apps/http/servers/srv0/routes);
          case "$$routes" in
            *iphonesta.com*) : ;;
            *)
              echo "installing iphonesta route";
              curl -s -X POST "http://localhost:2019/config/apps/http/servers/srv0/routes/0" -H "Content-Type: application/json" -d "$$ROUTE_JSON" && echo "route installed";
              ;;
          esac;
          sleep 20;
        done
    environment:
      ROUTE_JSON: '{"match":[{"host":["iphonesta.com","www.iphonesta.com"]}],"handle":[{"handler":"reverse_proxy","upstreams":[{"dial":"iphonesta-site:80"}]}],"terminal":true}'

networks:
  public-proxy:
    external: true
    name: public-proxy
