<!DOCTYPE html>
<html dir="rtl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>

</head>

  <circle cx="462" cy="386" r="6" fill="#D4AF37"/>
  <circle cx="52" cy="386" r="6" fill="#D4AF37"/>
